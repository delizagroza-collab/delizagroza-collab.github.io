<section class="page-hero life-v5-hero">

    <h1>一些我很喜欢的大学瞬间 ♡</h1>

  <section class="life-hero-photo">
    <img src="网站素材/crazy练习室合影.jpg" alt="Crazy练习室合影">
    <div class="life-simple-caption">
      <span>💃🏻 Crazy</span>
      <h2>练习室合影</h2>
      <p>一段舞从各跳各的，到最后能一起卡上点，是我很喜欢的过程。很多细节都是一遍遍磨出来的。</p>
    </div>
  </section>

  <section class="life-zhiqiu">
    <div class="life-zhiqiu-title">
      <span>01 / 知秋</span>
      <h2>很喜欢的一次舞台记录 🍂</h2>
    </div>

    <div class="life-editorial-row">
      <figure class="life-figure tall">
        <img src="知秋舞台单人.jpg" alt="知秋舞台单人照">
        <figcaption>
          <span>✨ 单人舞台</span>
          <p>这套橙白色真的很好看。舞台上只有几分钟，但前面的动作、位置和细节都要提前对很多遍。</p>
        </figcaption>
      </figure>

      <figure class="life-figure">
        <img src="知秋舞台照.jpg" alt="知秋舞台合照">
        <figcaption>
          <span>🫶🏻 双人舞</span>
          <p>最喜欢两个人节奏刚好对上的那一下。双人舞很有意思的一点是：自己跳对还不够，还要跟上对方的节奏。</p>
        </figcaption>
      </figure>
    </div>
  </section>

  <section class="life-memory-section">
    <div class="life-zhiqiu-title">
      <span>02 / Crazy & BP</span>
      <h2>一些随手拍下来的碎片 📸</h2>
    </div>

    <div class="life-memory-grid">
      <figure class="life-figure">
        <img src="网站素材/crazy候场自拍.jpg" alt="Crazy候场自拍">
        <figcaption>
          <span>🎀 候场</span>
          <p>上台之前，先拍一张。候场的时候大家还会顺手互相看看衣服、动作和顺序。</p>
        </figcaption>
      </figure>

      <article class="life-scroll-card life-scroll-card-v5">
        <div class="life-scroll-head">
          <div>
            <span>↕ 长图可滑动</span>
            <h3>BP 合照</h3>
          </div>
          <div class="scroll-hint">上下滑 ↓</div>
        </div>
        <div class="vertical-photo-scroll v5-scroll" aria-label="可上下滑动查看完整长图">
          <img src="网站素材/bp合照.jpg" alt="BP舞蹈合照长图">
        </div>
        <p class="life-note">这张保留原图比例，不裁切。</p>
      </article>

      <figure class="life-figure life-bp-single">
        <img src="网站素材/bp单人照.jpg" alt="BP单人照">
        <figcaption>
          <span>✿ 排练室</span>
          <p>普通的一天，也会认真练完，再顺手留下一张。</p>
        </figcaption>
      </figure>
    </div>
  </section>

  <section class="life-ending">
    <span>♡</span>
    <p>我很喜欢和一群人一起把一件小事慢慢做齐，也喜欢自己把一件事一点点练熟。</p>
  </section>
