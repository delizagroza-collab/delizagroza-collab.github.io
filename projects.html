<noscript><p class="fallback">页面未显示？<a href="rectifier-case.html">打开完整项目页面 ↗</a></p></noscript>
<script>
(function(){
  const frame=document.getElementById("project-viewer");
  function syncHash(){
    const h=window.location.hash;
    if(h && frame.contentWindow){
      try {frame.contentWindow.location.hash=h;}catch(e){}
    }
  }
  frame.addEventListener("load",function(){
    syncHash();
    try{
      const doc=frame.contentDocument;
      // If the original project has its own old site header, suppress only
      // that duplicated navigation. Keep all original project content untouched.
      const style=doc.createElement("style");
      style.textContent=".site-header,.main-site-header,.portfolio-header{display:none!important}";
      doc.head.appendChild(style);
      doc.addEventListener("click",function(event){
        const link=event.target.closest("a[href]");
        if(!link)return;
        const url=new URL(link.href,doc.baseURI);
        if(url.origin!==location.origin)return;
        const leaf=url.pathname.split("/").pop();
        const pages=["index.html","projects.html","experience.html","ai.html","life.html","contact.html","resume.html"];
        if(pages.includes(leaf)){
          event.preventDefault();
          window.location.href=(leaf==="projects.html"?"index.html":leaf)+url.hash;
        }
      });
    }catch(e){}
  });
  window.addEventListener("hashchange",syncHash);
})();
</script>
</body>
